[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maud-mcp"
version = "0.1.0"
description = "MCP server and Python toolkit for MAUD (Materials Analysis Using Diffraction) — Rietveld refinement, phase analysis and texture analysis driven by AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "FullPatt" }]
keywords = ["XRD", "Rietveld", "MAUD", "diffraction", "MCP", "materials-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
# 核心运行时只用标准库；Java 侧依赖本机 JDK + Maud.jar
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/FullPatt/MAUD-MCP"
Upstream = "https://github.com/luttero/maud"

[project.scripts]
maud-mcp = "maud_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["maud_mcp*"]

[tool.pytest.ini_options]
testpaths = ["src/maud_mcp/tests"]
